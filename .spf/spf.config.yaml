# .spf/spf.config.yaml — wilson CLI (Bun runtime, separate repo from `app/`)

# See app/.spf/spf.config.yaml for the full rationale: no fireworks/gemini/
# openai keys on gertie, so everything routes through gertie's own Ollama
# Cloud (glm-5.3-flash:cloud, confirmed reachable 2026-09-14). planner/
# reviewer/documenter are pinned in the packaged default roster and need
# their own override — an agent's own model: always wins over defaults.model.
defaults:
  coding_agent: flue
  model: ollama/glm-5.3-flash:cloud
  # spf@0.19.1+ only (opt-in, flue-backend-only). Without this, a silently
  # dead Ollama Cloud connection hangs the dispatch for Flue's own default
  # (1 hour) before anything notices — this is exactly what stalled
  # openaccountant/course#2 three times before the fix landed upstream
  # (seesharpguy/super-portable-software-factory#93). 900000ms = 15 min.
  request_timeout_ms: 900000

agents:
  - name: planner
    model: ollama/glm-5.3-flash:cloud
  - name: reviewer
    model: ollama/glm-5.3-flash:cloud
  - name: documenter
    model: ollama/glm-5.3-flash:cloud

quality:
  checks:
    - { name: typecheck, operation: typecheck, argv: ["bun", "run", "typecheck"], timeout_seconds: 60 }
    - { name: test,      operation: build,      argv: ["bun", "test"],            timeout_seconds: 300 }
  suites:
    test: [test]
    all: [typecheck, test]

protected_files:
  - .spf/
  - spf.config.yaml
  # Real provider keys live in .env — never something an agent should edit,
  # and env.example is the committed template it should touch instead.
  - .env
  - .env.*

watch:
  repo: openaccountant/wilson       # git@github.com:openaccountant/wilson.git
  base_branch: main
  label_prefix: spf
  chain: plan-build-test-quality    # gates on the `all` suite (typecheck + test) — single
                                    # package, so unlike app/ there's no per-package cost tradeoff
  # Was 2. Two issues in flight at once meant two branches cut from the same
  # main snapshot, each drifting further as the other's PR (and everything
  # else merging in the meantime) landed first — real content conflicts by
  # the time either got reviewed, not just line-shift noise. 1 keeps each
  # branch's base close to current main. Revisit once auto-approve-trusted.yml
  # + the merge queue are reliably clearing PRs same-day; concurrency is only
  # risky when PRs sit.
  concurrency: 1
  poll_ms: 60000
  fanout:
    n: 1
    concurrency: 2
