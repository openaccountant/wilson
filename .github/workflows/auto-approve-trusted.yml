name: Auto-approve Trusted PRs

# main's ruleset requires 1 approving review before a PR can enter the merge
# queue. On a solo-maintainer repo the PR author can never satisfy that for
# their own PRs (GitHub blocks self-approval), so automated PRs — Dependabot
# bumps, and the SPF factory's spf-watch/* branches — would sit forever with
# nothing able to approve them. That's the actual bottleneck this fixes.
#
# This workflow stands in as a second, distinct reviewer identity (the
# release-bot GitHub App, already on the ruleset's bypass list for release
# commits) and approves ONLY once CI is green, and ONLY for sources we
# already trust: the repo owner's own spf-watch/* branches, or dependabot[bot]
# PRs that docs/dependency-policy.md classifies as fast-track (grouped, or a
# same-major-version bump). A dependabot PR that bumps a major version still
# needs the manual validation steps in that doc and a deliberate
# `gh pr merge --admin` — this workflow leaves those alone on purpose.
# Anything else — including any external contributor's PR — is never
# touched here either.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  approve-and-merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the PR this run belongs to
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const runPRs = context.payload.workflow_run.pull_requests;
            if (!runPRs || runPRs.length === 0) {
              core.setOutput('number', '');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: runPRs[0].number,
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('author', pr.user.login);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('title', pr.title);

      - name: Decide trust
        id: trust
        run: |
          author="${{ steps.pr.outputs.author }}"
          branch="${{ steps.pr.outputs.branch }}"
          title="${{ steps.pr.outputs.title }}"

          if [ "$author" = "iamfiscus" ] && [[ "$branch" == spf-watch/* ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$author" != "dependabot[bot]" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Grouped PRs (dependabot.yml's minor-and-patch / actions groups)
          # are minor/patch by construction — dependabot.yml restricts each
          # group's update-types. Their titles don't have a "from X to Y",
          # e.g. "bump the minor-and-patch group across 1 directory with 6
          # updates" — matching "group" is enough to identify them.
          if [[ "$title" == *" group "* ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Standalone bump: "bump X from A to B" — trust it only if the
          # leading version component (major, or the only number GitHub
          # Actions use) is unchanged. A change there is a major bump and
          # needs the manual validation steps in docs/dependency-policy.md.
          # Matched separately (not "from A to B" as one pattern) because A
          # and B can be full semver ("3.0.125"), not just a bare integer.
          from=""
          to=""
          if [[ "$title" =~ from\ ([0-9]+) ]]; then from="${BASH_REMATCH[1]}"; fi
          if [[ "$title" =~ to\ ([0-9]+) ]]; then to="${BASH_REMATCH[1]}"; fi
          if [ -n "$from" ] && [ -n "$to" ] && [ "$from" = "$to" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            # Either a real major bump, or the title didn't match the
            # expected pattern at all — fail closed either way.
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.pr.outputs.number != '' && steps.trust.outputs.trusted == 'true'
        id: bot-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Approve as the bot identity
        if: steps.pr.outputs.number != '' && steps.trust.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh pr review ${{ steps.pr.outputs.number }} \
            --approve \
            --body "Auto-approved: CI green, trusted automated source (\`${{ steps.pr.outputs.author }}\`)." \
            --repo ${{ github.repository }}

      - name: Enable auto-merge (joins the merge queue once mergeable)
        if: steps.pr.outputs.number != '' && steps.trust.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --auto --squash --repo ${{ github.repository }}
