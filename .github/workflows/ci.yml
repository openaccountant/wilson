name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  check:
    # All three OSes: the WebGPU model path resolves execution providers from
    # platform-specific onnxruntime-node prebuilds, and Windows has its own
    # secret store (DPAPI), path rules and process model.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the per-file test loop below runs unchanged.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # Root typecheck and chat-markdown-img.test.ts import
      # src/dashboard/ui/src/lib/chatMarkdown.tsx, which needs the UI package's
      # own deps (react types etc.). It has a separate lockfile, so a fresh
      # checkout fails typecheck without this.
      - name: Install dashboard UI deps
        working-directory: src/dashboard/ui
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: |
          # Run each test file in its own process to prevent mock.module
          # contamination across files (Bun shares module cache in-process)
          FAIL=0
          for f in src/__tests__/*.test.ts; do
            if ! bun test "$f" 2>&1; then
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Smoke (CLI entrypoint + CSV import + secret store)
        run: |
          bun run src/index.tsx --version
          bun run src/index.tsx --help > /dev/null
          bun run scripts/smoke-cross-platform.ts

  # Encryption tests need the SQLCipher dylib, which only bun:sqlite on macOS
  # can load (Database.setCustomSQLite is a no-op elsewhere). Each file runs in
  # its own process so initSqlcipher() executes before any Database exists.
  check-encryption:
    # macos-14 images are retired ("macos-14-arm64-us-default is not supported").
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install SQLCipher
        run: |
          brew install sqlcipher
          test -f /opt/homebrew/opt/sqlcipher/lib/libsqlcipher.dylib

      - run: bun install --frozen-lockfile

      - name: Encrypted database tests
        run: |
          FAIL=0
          for f in src/__tests__/sqlcipher-dylib.test.ts \
                   src/__tests__/compat-sqlite.test.ts \
                   src/__tests__/encrypt-migrate.test.ts \
                   src/__tests__/database-init.test.ts \
                   src/__tests__/encryption-key.test.ts; do
            if ! bun test "$f" 2>&1; then
              FAIL=1
            fi
          done
          exit $FAIL
